<script>
/* ===== DATA LAYER (repository) — ganti adapter ini dengan database online nanti ===== */
const SCHEMA=1,KEY='kkhj:data',PIN='kkhj:pin';
const MONTHS=['Agustus','September','Oktober','November','Desember','Januari','Februari','Maret','April','Mei','Juni','Juli'];
const FEE=10000;
const NAMES=['Adzlan Pranata','Barraq Rayyan Atarahman','Dhefin El Fatih','Dzufar Omran Sahid','Elitky Risna Gigatama','Hanna Abidah Putri Al-Khalin','Khairunnisa Salsabila','Khalfa Al Ghossan Hasibuan','Mezzaluna Zeline','Muhammad Arsya Alfatih','Muhammad Arzan Ravindra','Muhammad Farish Hidayat Syah','Odellia Nadisya Yonand','Qianu Putra Mahendra','Talita Rodia Humaira','Zafran Azka Rafasya','Zeline Yuvifradella','Giselle Arista Naufal'];
const INIT=[7,12,12,12,12,12,0,12,6,12,12,12,12,12,0,3,0,0];

 transactions:INIT.map((m,i)=>m?{transactionId:'trx_seed_'+String(i+1).padStart(3,'0'),type:'payment',studentId:'stu_'+String(i+1).padStart(3,'0'),months:m,amount:m*FEE,date:null,note:'Saldo awal'}:null).filter(Boolean)}}
const MIGRATIONS={/* 1:(d)=>{...; d.schemaVersion=2; return d} */};
function migrate(d){while(d.schemaVersion<SCHEMA){const f=MIGRATIONS[d.schemaVersion];if(!f)throw Error('Versi data tidak dikenal');d=f(d)}return d}
function valid(d){return d&&typeof d==='object'&&Number.isInteger(d.schemaVersion)&&Array.isArray(d.students)&&Array.isArray(d.transactions)&&d.students.every(s=>s.studentId&&typeof s.name==='string')&&d.transactions.every(t=>t.transactionId&&['payment','expense'].includes(t.type)&&Number.isFinite(t.amount)&&t.amount>=0&&(t.type!=='payment'||d.students.some(s=>s.studentId===t.studentId)))}
const SB_URL='https://yxuhoxqabaexhzzveifs.supabase.co',SB_KEY='sb_publishable_PpGvM6MHD5R2nfZQkFHPLA_OThqNFKb';
const sb=supabase.createClient(SB_URL,SB_KEY);
let DB={schemaVersion:SCHEMA,students:[],transactions:[]},loadErr='';
async function load(){
 const [s,p,e]=await Promise.all([sb.from('students').select('*').order('student_id'),sb.from('payments').select('*'),sb.from('expenses').select('*')]);
 const er=s.error||p.error||e.error;if(er)throw er;
 DB={schemaVersion:SCHEMA,students:s.data.map(r=>({studentId:r.student_id,name:r.name})),
  transactions:[...p.data.map(r=>({transactionId:r.transaction_id,type:'payment',studentId:r.student_id,months:r.months,amount:r.amount,date:r.tx_date,note:r.note||''})),
  ...e.data.map(r=>({transactionId:r.transaction_id,type:'expense',amount:r.amount,date:r.tx_date,title:r.title,note:r.note||''}))]}}
async function ok(x){const r=await x;if(r.error)throw Error(r.error.message);return r}
async function isAdmin(){const {data}=await sb.auth.getSession();if(!data.session)return false;const r=await sb.from('admins').select('user_id').eq('user_id',data.session.user.id);return !!(r.data&&r.data.length)}
function summ(d){const P=d.transactions.filter(t=>t.type==='payment'),E=d.transactions.filter(t=>t.type==='expense');const i=P.reduce((a,t)=>a+t.amount,0),x=E.reduce((a,t)=>a+t.amount,0);return{n:d.students.length,p:P.length,e:E.length,i,x,b:i-x}}

let role=null,tab='home',sub='exp',q='',flt='all',modal=null,toastMsg='';
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* ===== AKSES: semua operasi tulis melewati guard ===== */
function guard(){if(role!=='admin')throw Error('Akses ditolak: Wali Murid hanya dapat melihat.')}
const Api={
 async addPayment(studentId,months){guard();const s=paid(studentId);months=+months;if(!Number.isInteger(months)||months<1||s+months>12)throw Error('Jumlah bulan tidak valid (sisa '+(12-s)+' bulan).');
  await ok(sb.from('payments').insert({transaction_id:uid('trx'),student_id:studentId,months,amount:months*FEE,tx_date:today(),note:''}));await load()},

  await ok(sb.from('expenses').insert({transaction_id:uid('trx'),tx_date:date,title:title.trim(),amount,note:note.trim()}));await load()},

  if(t.type==='payment'){const m=+v.months,others=paid(t.studentId)-t.months;if(!Number.isInteger(m)||m<1||others+m>12)throw Error('Jumlah bulan tidak valid.');
   await ok(sb.from('payments').update({months:m,amount:m*FEE,updated_at:now}).eq('transaction_id',id))}
  else{const a=+v.amount;if(!String(v.title).trim()||!(a>0)||!v.date)throw Error('Lengkapi tanggal, keterangan, dan nominal.');if(balance()+t.amount-a<0)throw Error('Nominal melebihi saldo kas.');
   await ok(sb.from('expenses').update({tx_date:v.date,title:String(v.title).trim(),amount:a,note:String(v.note||'').trim(),updated_at:now}).eq('transaction_id',id))}

  if(t.type==='payment'&&balance()-t.amount<0)throw Error('Saldo akan menjadi negatif. Hapus pengeluaran terkait lebih dulu.');
  await ok(sb.from(t.type==='payment'?'payments':'expenses').delete().eq('transaction_id',id));await load()},
 async importData(d){guard();

  const P=d.transactions.filter(t=>t.type==='payment'),E=d.transactions.filter(t=>t.type==='expense');
  if(P.length)await ok(sb.from('payments').upsert(P.map(t=>({transaction_id:t.transactionId,student_id:t.studentId,months:t.months,amount:t.amount,tx_date:t.date||null,note:t.note||''})),{onConflict:'transaction_id'}));
  if(E.length)await ok(sb.from('expenses').upsert(E.map(t=>({transaction_id:t.transactionId,tx_date:t.date,title:t.title,amount:t.amount,note:t.note||''})),{onConflict:'transaction_id'}));
  await load()}};

/* ===== HITUNGAN ===== */

const paid=id=>DB.transactions.filter(t=>t.type==='payment'&&t.studentId===id).reduce((a,t)=>a+t.months,0);
const income=()=>DB.transactions.filter(t=>t.type==='payment').reduce((a,t)=>a+t.amount,0);
const spent=()=>DB.transactions.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
const balance=()=>income()-spent();
const st=m=>m>=12?'l':m>0?'p':'n';
const stLabel={l:'Lunas',p:'Belum Lunas',n:'Belum Bayar'};
const info=m=>m>=12?'Lunas sampai Juli':m>0?'Bayar sampai '+MONTHS[m-1]:'Belum ada pembayaran';
const counts=()=>{const c={l:0,p:0,n:0};DB.students.forEach(s=>c[st(paid(s.studentId))]++);return c};
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'Saldo awal';
const ini=n=>n.split(' ').slice(0,2).map(w=>w[0]).join('');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=n=>`<i data-lucide="${n}"></i>`;
/* ===== KOMPONEN ===== */
const Header=(sub,t,right='')=>`<div class="top"><div><small>${sub}</small><h1>${t}</h1></div><div style="display:flex;gap:8px">${right}<button class="ib" data-a="logout" aria-label="Ganti mode">${ic('log-out')}</button></div></div>`;
const PaymentStatus=m=>`<span class="pill p-${st(m)}">${stLabel[st(m)]}</span>`;
const StudentCard=(s,clk)=>{const m=paid(s.studentId);return`<div class="row ${clk?'c':''}" ${clk?`data-a="pay" data-id="${s.studentId}"`:''}><div class="av">${esc(ini(s.name))}</div><div class="t"><b>${esc(s.name)}</b><small>${info(m)}</small></div><div class="r">${rp(m*FEE)}<br>${PaymentStatus(m)}</div></div>`};
const EmptyState=(i,t,d)=>`<div class="empty"><div class="ic">${ic(i)}</div><b>${t}</b>${d}</div>`;
const SearchBar=()=>`<div class="search">${ic('search')}<input id="q" placeholder="Cari nama siswa…" value="${esc(q)}" autocomplete="off"></div>`;
const TransactionItem=t=>{const x=t.type==='expense';const s=x?null:DB.students.find(s=>s.studentId===t.studentId);
 return`<div class="ti ${x?'x':''}" ${role==='admin'?`data-a="tx" data-id="${t.transactionId}" style="cursor:pointer"`:''}><div><small>${fd(t.date)} · ${x?'Pengeluaran':'Pembayaran'}</small><b>${x?esc(t.title):esc(s?s.name:'-')}</b>${!x&&t.months?`<small>${t.months} bulan${t.note?' · '+esc(t.note):''}</small>`:''}${x&&t.note?`<small>${esc(t.note)}</small>`:''}</div><div class="a" style="color:var(--${x?'no':'ok'})">${x?'−':'+'}${rp(t.amount)}</div></div>`};
const ProgressCard=()=>{const c=counts(),n=DB.students.length,pct=n?c.l/n*100:0;
 return`<div class="prog"><b style="font-size:16px">${c.l} dari ${n} siswa sudah lunas</b><div class="bar"><div style="width:${pct}%"></div></div><div class="leg"><span><i style="background:var(--ok)"></i>${c.l} lunas</span><span><i style="background:var(--wa)"></i>${c.p} belum lunas</span><span><i style="background:var(--no)"></i>${c.n} belum bayar</span></div></div>`};
const Hero=()=>{const dots=DB.students.map(s=>`<i class="${st(paid(s.studentId))}" title="${esc(s.name)}"></i>`).join('');
 return`<div class="hero"><p>Saldo kas saat ini</p><div class="big">${rp(balance())}</div><div class="dots">${dots}</div><div class="sub"><span>Kas masuk<b>${rp(income())}</b></span><span>Pengeluaran<b>${rp(spent())}</b></span><span>Siswa<b>${DB.students.length}</b></span></div></div>`};
const Nav=items=>`<nav class="nav">${items.map(([k,l,i])=>`<button class="${tab===k?'on':''}" data-a="tab" data-k="${k}">${ic(i)}${l}</button>`).join('')}</nav>`;
const Modal=(t,body)=>`<div class="mod" data-a="close"><div class="sheet"><h3>${t}</h3>${body}</div></div>`;
const expList=()=>{const e=DB.transactions.filter(t=>t.type==='expense').sort((a,b)=>b.date.localeCompare(a.date));
 return e.length?`<div class="tl">${e.map(TransactionItem).join('')}</div>`:EmptyState('piggy-bank','Belum ada pengeluaran','Dana kas kelas belum digunakan.')};
const students=clk=>{const l=DB.students.filter(s=>s.name.toLowerCase().includes(q.toLowerCase())&&(flt==='all'||st(paid(s.studentId))===flt));
 return`${SearchBar()}<div class="chips">${[['all','Semua'],['l','Lunas'],['p','Belum lunas'],['n','Belum bayar']].map(([k,v])=>`<button class="chip ${flt===k?'on':''}" data-a="flt" data-k="${k}">${v}</button>`).join('')}</div><div class="list" id="sl">${l.length?l.map(s=>StudentCard(s,clk)).join(''):EmptyState('search','Siswa tidak ditemukan','Coba nama lain.')}</div>`};
/* ===== HALAMAN ===== */
const PER='Agustus 2026 – Juli 2027';
function Home(adm){const recent=DB.transactions.filter(t=>t.date).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
 return`${Header(adm?'Mode Bendahara':'Transparansi Kas Kelas','Kas Kelas Hang Jebat')}<p style="color:var(--mut);margin:-10px 0 16px;font-weight:600">Periode ${adm?PER:'Agustus – Juli'}</p>${Hero()}
 <div class="sec"><h2>Progres pembayaran</h2></div>${ProgressCard()}
 ${adm?`<div class="sec"><h2>Terbaru</h2><a data-a="tab" data-k="cash">Lihat semua</a></div>${recent.length?`<div class="tl">${recent.map(TransactionItem).join('')}</div>`:`<div class="empty" style="padding:22px">Belum ada transaksi baru sejak saldo awal.</div>`}`:''}`}
function Cash(){return`${Header('Mode Bendahara','Kas',`<button class="ib" data-a="addexp" aria-label="Tambah pengeluaran">${ic('plus')}</button>`)}
 <div class="chips"><button class="chip ${sub==='exp'?'on':''}" data-a="sub" data-k="exp">Pengeluaran</button><button class="chip ${sub==='his'?'on':''}" data-a="sub" data-k="his">Riwayat</button></div>
 ${sub==='exp'?expList()+`<button class="btn w" style="margin-top:14px" data-a="addexp">${ic('receipt')}Tambah pengeluaran</button>`:`<div class="tl">${[...DB.transactions].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(TransactionItem).join('')}</div>`}`}
function Rekap(adm){const c=counts(),n=DB.students.length;const seg=(v,col)=>`<div style="flex:${v};background:var(--${col})"></div>`;
 return`${Header(adm?'Mode Bendahara':'Transparansi Kas Kelas','Rekap')}<div class="card" style="padding:18px"><b>Status pembayaran ${n} siswa</b><div class="stack">${seg(c.l,'ok')}${seg(c.p,'wa')}${seg(c.n,'no')}</div><div class="leg"><span><i style="background:var(--ok)"></i>Lunas</span><span><i style="background:var(--wa)"></i>Belum lunas</span><span><i style="background:var(--no)"></i>Belum bayar</span></div></div>
 <div class="card" style="margin-top:12px">${[['Total siswa',n],['Jumlah lunas',c.l],['Belum lunas',c.p],['Belum bayar',c.n],['Total kas',rp(income())],['Total pengeluaran',rp(spent())],['Saldo',rp(balance())]].map(([a,b])=>`<div class="rk"><span>${a}</span><b>${b}</b></div>`).join('')}</div>
 ${adm?`<div class="sec"><h2>Cadangan data</h2></div><div style="display:flex;gap:10px"><button class="btn g" style="flex:1" data-a="export">${ic('download')}Ekspor</button><button class="btn g" style="flex:1" data-a="import">${ic('upload')}Impor</button></div><input type="file" id="file" accept="application/json" hidden>`:''}`}
function Welcome(){return`<div class="welcome page"><div class="av" style="width:56px;height:56px;border-radius:20px;background:var(--navy);color:#fff">${ic('wallet')}</div><h1>Kas Kelas<br>Hang Jebat</h1><p class="s">Periode ${PER}. Pilih cara Anda melihat kas kelas.</p>
 <button class="role" data-a="login-wali"><div class="av">${ic('users')}</div><div><b>Wali Murid</b><small>Lihat saldo, status pembayaran, dan pengeluaran</small></div></button>
 <button class="role" data-a="login-admin"><div class="av" style="background:var(--mint);color:var(--teal)">${ic('lock')}</div><div><b>Bendahara</b><small>Kelola pembayaran dan pengeluaran</small></div></button></div>`}
function view(){if(!role)return Welcome();const a=role==='admin';let h;
 if(tab==='home')h=Home(a);else if(tab==='stu')h=Header(a?'Mode Bendahara':'Transparansi Kas Kelas','Siswa')+students(a);
 else if(tab==='cash')h=a?Cash():Header('Transparansi Kas Kelas','Pengeluaran Kelas')+expList();else h=Rekap(a);
 const items=a?[['home','Beranda','house'],['stu','Siswa','users'],['cash','Kas','wallet'],['rekap','Rekap','bar-chart-3']]:[['home','Beranda','house'],['stu','Siswa','users'],['cash','Pengeluaran','receipt'],['rekap','Rekap','bar-chart-3']];
 return`<div class="page" key="${tab}${sub}">${h}</div>${Nav(items)}`}
/* ===== RENDER & EVENT ===== */
function render(keep){const app=document.getElementById('app');app.innerHTML=view()+(modal||'')+(toastMsg?`<div class="toast">${toastMsg}</div>`:'');lucide.createIcons();
 const qi=document.getElementById('q');if(qi){qi.oninput=e=>{q=e.target.value;document.getElementById('sl').outerHTML=students(role==='admin').match(/<div class="list"[\s\S]*$/)[0]; lucide.createIcons()};if(keep){qi.focus()}}
 const f=document.getElementById('file');if(f)f.onchange=e=>{const r=new FileReader();r.onload=()=>{try{toast('Data berhasil dipulihkan')}catch(x){toast(x.message)}};if(e.target.files[0])r.readAsText(e.target.files[0])}}
function toast(m){toastMsg=m;render();setTimeout(()=>{toastMsg='';render()},2200)}
async function hash(s){if(!(window.crypto&&crypto.subtle)){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return'x'+h}const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const ask=(t,extra='')=>Modal(t,`<label>PIN Bendahara</label><input class="f" id="pin" type="password" inputmode="numeric" autocomplete="off">${extra}<div class="err" id="err"></div><button class="btn w" style="margin-top:16px" data-a="pinok">Masuk</button>`);
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id,k=el.dataset.k;if(a==='close'&&el.classList.contains('mod')&&e.target!==el)return;if(['paysave','expsave','txsave','txdel2','doimport'].includes(a)){if(window._w)return;window._w=1}
 try{
 if(a==='login-wali'){role='wali';tab='home';render()}
 else if(a==='login-admin'){if(await isAdmin()){role='admin';tab='home';render();return}modal=Modal('Masuk sebagai Bendahara','<label>Email</label><input class="f" id="em" type="email" autocomplete="username"><label>Password</label><input class="f" id="pw" type="password" autocomplete="current-password"><div class="err" id="err"></div><button class="btn w" style="margin-top:16px" data-a="pinok">Masuk</button>');render()}
 else if(a==='pinok'){const r=await sb.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});
  if(r.error){document.getElementById('err').textContent='Email atau password salah.';return}
  if(!(await isAdmin())){await sb.auth.signOut();document.getElementById('err').textContent='Akun ini bukan Bendahara.';return}
  role='admin';tab='home';modal=null;render()}
 else if(a==='logout'){sb.auth.signOut();role=null;modal=null;q='';render()}
 else if(a==='tab'){tab=k;q='';try{await load()}catch(e){}render()}
 else if(a==='sub'){sub=k;render()}
 else if(a==='flt'){flt=k;render(true)}
 else if(a==='close'){modal=null;render()}
 else if(a==='pay'){const s=DB.students.find(s=>s.studentId===id),m=paid(id),left=12-m;
  modal=left?Modal('Catat pembayaran',`<b>${esc(s.name)}</b><br><small style="color:var(--mut)">${info(m)}</small><label>Tambah berapa bulan? (${rp(FEE)} / bulan)</label><select class="f" id="mo">${Array.from({length:left},(_,i)=>`<option value="${i+1}">${i+1} bulan — ${rp((i+1)*FEE)} (sampai ${MONTHS[m+i]})</option>`).join('')}</select><div class="err" id="err"></div><button class="btn w" style="margin-top:16px" data-a="paysave" data-id="${id}">Simpan pembayaran</button>`):Modal(s.name,'<p>Siswa ini sudah lunas 12 bulan.</p>');render()}
 else if(a==='paysave'){await Api.addPayment(id,document.getElementById('mo').value);modal=null;toast('Pembayaran disimpan')}
 else if(a==='addexp'){modal=Modal('Tambah pengeluaran',`<label>Tanggal</label><input class="f" id="d" type="date" value="${today()}"><label>Keterangan</label><input class="f" id="t" placeholder="Contoh: Beli spidol"><label>Nominal (Rp)</label><input class="f" id="n" type="number" inputmode="numeric" min="1"><label>Catatan (opsional)</label><textarea class="f" id="c" rows="2"></textarea><div class="err" id="err"></div><button class="btn w" style="margin-top:16px" data-a="expsave">Simpan pengeluaran</button>`);render()}
 else if(a==='expsave'){const g=i=>document.getElementById(i).value;await Api.addExpense(g('d'),g('t'),g('n'),g('c'));modal=null;toast('Pengeluaran disimpan')}
 else if(a==='tx'){guard();const t=DB.transactions.find(t=>t.transactionId===id);if(!t)return;
  const del=`<button class="btn g w" style="margin-top:8px;color:var(--no)" data-a="txdel" data-id="${id}">${ic('trash-2')}Hapus transaksi</button>`;
  if(t.type==='payment'){const s=DB.students.find(s=>s.studentId===t.studentId),max=12-(paid(t.studentId)-t.months);
   modal=Modal('Ubah pembayaran',`<b>${esc(s.name)}</b><br><small style="color:var(--mut)">${fd(t.date)}</small><label>Jumlah bulan (${rp(FEE)} / bulan)</label><select class="f" id="mo">${Array.from({length:max},(_,i)=>`<option value="${i+1}" ${i+1===t.months?'selected':''}>${i+1} bulan — ${rp((i+1)*FEE)}</option>`).join('')}</select><div class="err" id="err"></div><button class="btn w" style="margin-top:16px" data-a="txsave" data-id="${id}">Simpan perubahan</button>${del}`)}
  else modal=Modal('Ubah pengeluaran',`<label>Tanggal</label><input class="f" id="d" type="date" value="${esc(t.date)}"><label>Keterangan</label><input class="f" id="t" value="${esc(t.title)}"><label>Nominal (Rp)</label><input class="f" id="n" type="number" inputmode="numeric" min="1" value="${t.amount}"><label>Catatan (opsional)</label><textarea class="f" id="c" rows="2">${esc(t.note||'')}</textarea><div class="err" id="err"></div><button class="btn w" style="margin-top:16px" data-a="txsave" data-id="${id}">Simpan perubahan</button>${del}`);
  render()}
 else if(a==='txsave'){const t=DB.transactions.find(t=>t.transactionId===id),g=i=>document.getElementById(i).value;
  await Api.updateTx(id,t.type==='payment'?{months:g('mo')}:{date:g('d'),title:g('t'),amount:g('n'),note:g('c')});modal=null;toast('Perubahan disimpan')}
 else if(a==='txdel'){guard();modal=Modal('Hapus transaksi?',`<p style="color:var(--mut)">Transaksi ini akan dihapus dan saldo dihitung ulang. Tindakan ini tidak dapat dibatalkan.</p><button class="btn w" style="margin-top:16px;background:var(--no)" data-a="txdel2" data-id="${id}">Ya, hapus</button><button class="btn g w" style="margin-top:8px" data-a="close">Batal</button>`);render()}
 else if(a==='txdel2'){await Api.deleteTx(id);modal=null;toast('Transaksi dihapus')}
 else if(a==='export'){guard();const j=JSON.stringify(DB,null,2);modal=Modal('Ekspor backup',`<p style="color:var(--mut);margin-bottom:8px">Simpan sebagai file, atau salin teksnya.</p><textarea class="f" id="bk" rows="7" readonly style="font-size:12px">${esc(j)}</textarea><div class="err" id="err"></div><div style="display:flex;gap:10px;margin-top:14px"><button class="btn" style="flex:1" data-a="savejson">${ic('download')}Simpan file</button><button class="btn g" style="flex:1" data-a="copyjson">Salin teks</button></div>`);render()}
 else if(a==='savejson'){guard();const d=await(window.claude&&window.claude.use?window.claude.use('downloads'):null);if(!d){const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='kas-hang-jebat-'+today()+'.json';l.click();toast('Backup diunduh');return}
  try{await d.save({filename:'kas-hang-jebat-'+today()+'.json',data:JSON.stringify(DB,null,2)});toast('Backup disimpan')}catch(x){if(!x||x.code!=='declined')throw Error('Gagal menyimpan file. Gunakan "Salin teks".')}}
 else if(a==='copyjson'){guard();const t=document.getElementById('bk');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}
  if(!ok&&navigator.clipboard){try{await navigator.clipboard.writeText(t.value);ok=true}catch(x){}}
  const er=document.getElementById('err');if(er){er.style.color=ok?'var(--ok)':'var(--no)';er.textContent=ok?'Teks tersalin.':'Gagal menyalin. Tekan lama pada teks, lalu pilih Salin.'}}
 else if(a==='import'){guard();modal=Modal('Impor backup','<p style="color:var(--mut);margin-bottom:8px">Tempel teks backup JSON dari aplikasi lama.</p><textarea class="f" id="imp" rows="8" style="font-size:12px"></textarea><div class="err" id="err"></div><button class="btn w" style="margin-top:14px" data-a="impprev">Periksa data</button>');render()}
 else if(a==='impprev'){guard();let d;try{d=JSON.parse(document.getElementById('imp').value)}catch(x){throw Error('Teks bukan JSON yang valid.')}
  if(!valid(d))throw Error('Struktur backup tidak valid.');d=migrate(d);
  const bad=d.transactions.find(t=>t.type==='payment'?!(Number.isInteger(t.months)&&t.months>=1&&t.months<=12&&t.amount>0):!(t.title&&t.date&&t.amount>0));if(bad)throw Error('Ada transaksi tidak valid: '+bad.transactionId);
  window._imp=d;const S=summ(d);
  modal=Modal('Pratinjau impor','<div class="card">'+[['Siswa',S.n],['Transaksi pembayaran',S.p],['Pengeluaran',S.e],['Total kas masuk',rp(S.i)],['Total pengeluaran',rp(S.x)],['Saldo',rp(S.b)]].map(([a,b])=>`<div class="rk"><span>${a}</span><b>${b}</b></div>`).join('')+'</div><p style="color:var(--mut);margin-top:10px">Cocokkan dengan data Anda. Impor tidak menghapus apa pun.</p><div class="err" id="err"></div><button class="btn w" style="margin-top:12px" data-a="doimport">Impor ke database</button>');render()}
 else if(a==='doimport'){guard();const d=window._imp;if(!d)throw Error('Periksa data dulu.');await Api.importData(d);
  const A=summ(d),B=summ(DB),same=A.n===B.n&&A.p===B.p&&A.e===B.e&&A.i===B.i&&A.x===B.x;
  modal=Modal(same?'Impor berhasil':'Perlu dicek',`<div class="card">${[['Siswa',A.n+' → '+B.n],['Pembayaran',A.p+' → '+B.p],['Total kas masuk',rp(A.i)+' → '+rp(B.i)],['Pengeluaran',rp(A.x)+' → '+rp(B.x)]].map(([a,b])=>`<div class="rk"><span>${a}</span><b>${b}</b></div>`).join('')}</div><p style="margin-top:10px;color:var(--${same?'ok':'no'})">${same?'Data di database cocok dengan file backup.':'Ada perbedaan. Jangan bagikan link dulu dan kirim hasil ini ke pengembang.'}</p>`);render()}
 }catch(x){const er=document.getElementById('err');if(er)er.textContent=x.message;else toast(x.message)}finally{window._w=0}});
document.getElementById('app').innerHTML='<div class="empty" style="margin-top:40vh">Memuat data…</div>';
(async()=>{try{await load();render()}catch(x){document.getElementById('app').innerHTML='<div class="empty" style="margin-top:30vh"><b>Data belum bisa dimuat</b>'+esc(x.message||x)+'<br><br><button class="btn" onclick="location.reload()">Coba lagi</button></div>'}})();
</script></body></html>
